<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Picker App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="color-picker">
    <h1>Color Picker</h1>
    <div class="preview">
      <div id="color-preview" class="color-box"></div>
      <div class="hex-area">
        <label for="hex-input">Hex:</label>
        <input type="text" id="hex-input" value="#FFFFFF" readonly>
        <button id="copy-btn">Copy</button>
      </div>
    </div>
    <div class="controls">
      <div class="presets">
        <h2>Presets</h2>
        <div id="preset-panel"></div>
      </div>
      <div class="rgb">
        <h2>RGB Sliders</h2>
        <div class="slider">
          <label for="red">Red:</label>
          <input type="range" id="red" min="0" max="255" value="255">
          <span id="red-val">255</span>
        </div>
        <div class="slider">
          <label for="green">Green:</label>
          <input type="range" id="green" min="0" max="255" value="255">
          <span id="green-val">255</span>
        </div>
        <div class="slider">
          <label for="blue">Blue:</label>
          <input type="range" id="blue" min="0" max="255" value="255">
          <span id="blue-val">255</span>
        </div>
      </div>
    </div>
    <button id="reset-btn">Reset to White</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
